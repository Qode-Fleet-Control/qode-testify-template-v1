# Scans sonarqube.qode.world on push to main and on demand. A separate workflow from
# build.yml -- Community Build can't gate a PR (no PR decoration), so this only ever
# reports after merge -- and does NOT inherit build.yml's secrets or env.
#
# The "Run tests with coverage" step below is not optional. sonar-project.properties
# already points sonar.go.coverage.reportPaths at coverage.out; nothing else in this repo
# produces that file. Skip this step, or let it silently stop running, and every future
# push reports 0% coverage forever.
name: sonarqube
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Run tests with coverage
        run: go test -coverprofile=coverage.out -covermode=atomic ./...
      - uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      - uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
