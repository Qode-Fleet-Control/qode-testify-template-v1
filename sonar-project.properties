sonar.projectKey=Qode-Fleet-Control_qode-testify-template-v1
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/dist/**,**/vendor/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go
# Belt-and-suspenders: sonar.tests/test.inclusions already classify these as tests, not
# sources, but this makes the coverage denominator exclude them explicitly too.
sonar.coverage.exclusions=**/*_test.go
# .github/workflows/sonarqube.yml writes this before the scan. If this ever reads 0%,
# check whether that step stopped running before assuming the module has no tests.
sonar.go.coverage.reportPaths=coverage.out
